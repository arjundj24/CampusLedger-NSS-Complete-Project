<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student activity · CampusLedger</title><link rel="stylesheet" href="/style.css?v=12"><script defer src="/assets/icons.js"></script><script defer src="/demo-data.js?v=12"></script><script defer src="/tools.js?v=12"></script><script defer src="/activities.js?v=12"></script><script defer src="/bento.js?v=2"></script><script defer src="/app.js?v=studio2"></script><script>function detail(r){let s=stud(r.student);return back(teach()?'student/'+s.id:'portfolio',s.name+"’s portfolio")+heading('Activity record',E(r.title),'Submission details and verification history.')+`<div class="studioreview">${proofPanel(r)}<div class="sheet data"><div class="between"><h3>Activity details</h3>${tag(r)}</div><div class="meta"><div><small>Student</small>${link(teach()?'student/'+s.id:'portfolio',E(s.name))}</div><div><small>Registration</small><b>${s.reg}</b></div><div><small>Group</small><b>Group ${gr[r.grp]} · ${gn[r.grp]}</b></div><div><small>Activity date</small><b>${pretty(r.date)}</b></div><div><small>${r.status==='Approved'?'Verified':'Requested'} points</small><b>${r.points}</b></div></div><p><b>Student description</b><br>${E(r.notes)||'No description provided.'}</p>${r.feedback?`<div class="rulesummary"><b>Teacher feedback</b><p>${E(r.feedback)}</p></div>`:''}</div>${reviewHistory(r)}${teach()&&r.status==='Pending'?`<form id="review" class="sheet data"><h3>Faculty decision</h3><label class="lab" for="award">Award points</label><input class="entry" id="award" type="number" min="0" max="40" value="${r.points}" required><label class="lab" for="note">Feedback to student</label><textarea class="entry" id="note" placeholder="Add a note or explain the correction needed"></textarea><div class="action"><button class="primary" value="Approved">Approve points</button><button class="btn" value="Correction requested">Request correction</button></div></form>`:!tea
