<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student submit-activity · CampusLedger</title><link rel="stylesheet" href="/style.css?v=12"><script defer src="/assets/icons.js"></script><script defer src="/demo-data.js?v=12"></script><script defer src="/tools.js?v=12"></script><script defer src="/activities.js?v=12"></script><script defer src="/bento.js?v=2"></script><script defer src="/app.js?v=studio2"></script><script>function form(r){return back('portfolio','My portfolio')+heading('Student workspace',r?'Revise activity':'Submit an activity','Add an achievement and its supporting certificate for faculty verification.')+`<div class="studioform">${assist()}<form id="submission" class="sheet data"><div class="between"><h3>Activity information</h3>${ava(S.me.name)}</div><p>Submitting as <b>${S.me.name}</b> · ${S.me.reg}</p>${r?.feedback?`<div class="rulesummary"><b>Teacher feedback</b><p>${E(r.feedback)}</p></div>`:''}<div id="draftState"></div><p class="muted">Fields marked * are required.</p><label class="lab" for="title">Activity title *</label><input class="entry" id="title" name="title" maxlength="150" value="${E(r?.title)}" required placeholder="e.g. Intercollege innovation showcase"><div class="pair"><div><label class="lab" for="grp">Activity group *</label><select class="entry" id="grp" name="grp" required><option value="" disabled ${r?'':'selected'}>Choose the activity group…</option>${gr.map((v,i)=>`<option value="${i}" ${r?.grp===i?'selected':''}>${v} — ${gn[i]}</option>`).join('')}</select></div><div><label class="lab" for="date">Activity date *</label><input class="entry" id="date" name="date" type="date" value="${E(r?.date)}" required></div></div><label class="lab" for="points">Requested points *</label><input class="entry" id="points" type="number" name="points" min="1" max="40" value="${E(r?.points)}" required><label class="lab" for="notes">Description (optional)</label><textarea class="entry" id="notes" name="notes" maxlength="1500" placeholder="Your role, result or contribution">${E(r?.notes)}</textarea><label class="lab" for="proof">Supporting certificate *</label><input class="entry" id="proof" name="proof" type="file" accept=".pdf,.png,.jpg,.jpeg" required><small>PDF, PNG or JPEG · up to 3 MB</small><div class="action"><button class="primary">Submit for review ${I('arrow-right')}</button><button type="button" class="btn" onclick="saveDraft()">Save draft</button></div><small>Drafts save text on this browser only, not the certificate.</small></form></div>`}</script><link rel="stylesheet" href="/bento.css"><link rel="stylesheet" href="/studio.css?v=2"></head><body data-page="submit"><div id="root"></div><div id="toast" role="status"></div></body></html>
